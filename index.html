<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Investičný Simulátor s Ročnými Súhrnmi</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="Roboto-Regular-normal.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f4f4f4;
    }
    h1 {
      color: #2c3e50;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select {
      padding: 8px;
      margin-top: 5px;
      width: 220px;
    }
    button {
      margin-top: 15px;
      margin-right: 5px;
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #2980b9;
    }
    .zoom-btn {
      background-color: #9b59b6;
    }
    .zoom-btn:hover {
      background-color: #8e44ad;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
      font-size: 1.2em;
    }
    #chart-container {
      margin-top: 15px;
      width: 100%;
      max-width: 900px; /* Mierne rozšírené kvôli dvom krivkám */
    }
    table {
      width: 100%;
      max-width: 900px;
      border-collapse: collapse;
      margin-top: 30px;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: right;
    }
    th {
      background-color: #2c3e50;
      color: white;
      text-align: center;
    }
    td:first-child, th:first-child {
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>Investičný Simulátor (Porovnanie)</h1>

  <label>Počiatočná investícia (€):
    <input type="number" id="investment" value="1000">
  </label>

  <label>Mesačný vklad (€):
    <input type="number" id="monthlyDeposit" value="100">
  </label>

  <label>Ročný výnos (%):
    <input type="number" id="interestRate" value="6">
  </label>

  <label>Úrokové obdobie (pre zložené úr.):
    <select id="compoundPeriod">
      <option value="12">Mesačne</option>
      <option value="4">Štvrťročne</option>
      <option value="2">Polročne</option>
      <option value="1" selected>Ročne</option>
    </select>
  </label>

  <label>Ročná inflácia (%):
    <input type="number" id="inflationRate" value="2">
  </label>

  <label>Počet rokov:
    <input type="number" id="years" value="20">
  </label>

  <button onclick="runSimulation()">Simulovať</button>

  <div id="result"></div>

  <!-- Tlačidlá na priblíženie grafu -->
  <div style="margin-top: 30px;">
    <strong style="margin-right: 10px; color: #2c3e50;">Priblíženie grafu:</strong>
    <button class="zoom-btn" onclick="applyZoom(4)">0 - 4 roky</button>
    <button class="zoom-btn" onclick="applyZoom(10)">0 - 10 rokov</button>
    <button class="zoom-btn" onclick="applyZoom('all')">Zobraziť všetky roky</button>
  </div>

  <!-- Samotný graf (pod tlačidlami) -->
  <div id="chart-container">
    <canvas id="investmentChart"></canvas>
  </div>

  <div id="table-wrapper"></div>

  <div style="margin-top: 20px;">
    <label for="bgColorSelect" style="display:inline-block; margin-right: 10px;">Farba pozadia grafu:</label>
    <select id="bgColorSelect" style="width: auto;">
      <option value="#ffffff">Biela</option>
      <option value="#f0f0f0">Svetlo sivá</option>
      <option value="#eafaf1">Svetlo zelená</option>
      <option value="#e0f7fa">Svetlo modrá</option>
      <option value="#fff3e0">Svetlo oranžová</option>
      <option value="#000000">Čierna</option>
    </select>
  </div>

  <div style="margin-top: 10px;">
    <button onclick="exportCSV()">Exportovať do CSV</button>
    <button onclick="exportPDF()">Exportovať do PDF</button>
    <button onclick="exportChart()">Exportovať graf (PNG)</button>
    <button onclick="exportChartAndTableToPDF()">Exportovať graf + tabuľku do PDF</button>
  </div>

  <script>
    let myChart = null;
    
    // Ukladáme dáta simulácie do globálnej premennej pre plynulé fungovanie zoomovania
    let globalData = {
      labels: [],
      compNom: [], compReal: [],
      simpNom: [], simpReal: []
    };

    function runSimulation() {
      const initial = parseFloat(document.getElementById("investment").value);
      const monthly = parseFloat(document.getElementById("monthlyDeposit").value);
      const rate = parseFloat(document.getElementById("interestRate").value) / 100;
      const inflation = parseFloat(document.getElementById("inflationRate").value) / 100;
      const years = parseInt(document.getElementById("years").value);
      const periodsPerYear = parseInt(document.getElementById("compoundPeriod").value);

      if (isNaN(initial) || isNaN(rate) || isNaN(inflation) || isNaN(monthly) || isNaN(years)) {
        document.getElementById("result").textContent = "Zadajte platné čísla.";
        return;
      }

      let compAmount = initial;
      let totalContributions = initial;
      let simpInterestTotal = 0; 

      let tableHTML = `<table>
        <thead>
          <tr>
            <th rowspan="2">Rok</th>
            <th rowspan="2">Celkový vklad (€)</th>
            <th colspan="2">Zložené úrokovanie</th>
            <th colspan="2">Jednoduché úrokovanie</th>
          </tr>
          <tr>
            <th>Nominál (€)</th>
            <th>Reálne (€)</th>
            <th>Nominál (€)</th>
            <th>Reálne (€)</th>
          </tr>
        </thead>
        <tbody>`;

      // Reset dát
      globalData = { labels: [], compNom: [], compReal: [], simpNom: [], simpReal: [] };

      // Pridanie 0. roku
      globalData.labels.push('Rok 0');
      globalData.compNom.push(initial);
      globalData.compReal.push(initial);
      globalData.simpNom.push(initial);
      globalData.simpReal.push(initial);

      tableHTML += `<tr>
          <td>0</td>
          <td>${initial.toFixed(2)}</td>
          <td style="background-color: #eafaf1;">${initial.toFixed(2)}</td>
          <td style="background-color: #eafaf1;">${initial.toFixed(2)}</td>
          <td style="background-color: #eaf2f8;">${initial.toFixed(2)}</td>
          <td style="background-color: #eaf2f8;">${initial.toFixed(2)}</td>
        </tr>`;

      // Výpočet po rokoch
      for (let y = 1; y <= years; y++) {
        for (let m = 1; m <= 12; m++) {
          compAmount += monthly;
          totalContributions += monthly;

          // Zložené úrokovanie
          if (m % (12 / periodsPerYear) === 0) {
            compAmount *= (1 + rate / periodsPerYear);
          }

          // Jednoduché úrokovanie (z počiatočného vkladu a doterajších vkladov)
          simpInterestTotal += (totalContributions * rate) / 12;
        }

        let currentSimpAmount = totalContributions + simpInterestTotal;

        // Výpočet reálnej hodnoty (očistenej o infláciu)
        let compReal = compAmount / Math.pow(1 + inflation, y);
        let simpReal = currentSimpAmount / Math.pow(1 + inflation, y);

        globalData.labels.push(`Rok ${y}`);
        globalData.compNom.push(compAmount);
        globalData.compReal.push(compReal);
        globalData.simpNom.push(currentSimpAmount);
        globalData.simpReal.push(simpReal);

        tableHTML += `<tr>
          <td>${y}</td>
          <td>${totalContributions.toFixed(2)}</td>
          <td style="background-color: #eafaf1;">${compAmount.toFixed(2)}</td>
          <td style="background-color: #eafaf1;">${compReal.toFixed(2)}</td>
          <td style="background-color: #eaf2f8;">${currentSimpAmount.toFixed(2)}</td>
          <td style="background-color: #eaf2f8;">${simpReal.toFixed(2)}</td>
        </tr>`;
      }

      tableHTML += `</tbody></table>`;
      document.getElementById("table-wrapper").innerHTML = tableHTML;

      const finalComp = globalData.compNom[globalData.compNom.length - 1];
      const finalSimp = globalData.simpNom[globalData.simpNom.length - 1];

      document.getElementById("result").innerHTML = 
        `Konečná hodnota (Zložené úročenie): <span style="color: #27ae60;">${finalComp.toFixed(2)} €</span><br>` +
        `Konečná hodnota (Jednoduché úročenie): <span style="color: #2980b9;">${finalSimp.toFixed(2)} €</span>`;

      // Predvolene zobrazíme všetky dáta v grafe
      applyZoom('all');
    }

    // Funkcia na výrez grafu podla kliknutia
    function applyZoom(maxYears) {
      if (globalData.labels.length === 0) return; 

      let limit = maxYears === 'all' ? globalData.labels.length : maxYears + 1;
      
      let sliceLabels = globalData.labels.slice(0, limit);
      let sliceCompNom = globalData.compNom.slice(0, limit);
      let sliceCompReal = globalData.compReal.slice(0, limit);
      let sliceSimpNom = globalData.simpNom.slice(0, limit);
      let sliceSimpReal = globalData.simpReal.slice(0, limit);

      drawChart(sliceLabels, sliceCompNom, sliceCompReal, sliceSimpNom, sliceSimpReal);
    }

    // Samotné kreslenie grafu
    function drawChart(labels, compN, compR, simpN, simpR) {
      const ctx = document.getElementById('investmentChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Zložené - Nominál',
              data: compN,
              borderColor: '#2ecc71',
              backgroundColor: 'rgba(46, 204, 113, 0.1)',
              fill: true,
              tension: 0.2
            },
            {
              label: 'Zložené - Reálne',
              data: compR,
              borderColor: '#27ae60',
              borderDash: [5, 5],
              fill: false,
              tension: 0.2
            },
            {
              label: 'Jednoduché - Nominál',
              data: simpN,
              borderColor: '#3498db',
              backgroundColor: 'rgba(52, 152, 219, 0.1)',
              fill: true,
              tension: 0.2
            },
            {
              label: 'Jednoduché - Reálne',
              data: simpR,
              borderColor: '#2980b9',
              borderDash: [5, 5],
              fill: false,
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)} €` } }
          },
          scales: {
            y: { ticks: { callback: value => value + ' €' } }
          }
        }
      });
    }

    // Automatické spustenie po načítaní
    window.onload = function() {
      runSimulation();
    };

    // --- Export funkcie ---
    function exportCSV() {
      const rows = document.querySelectorAll("table tr");
      if (rows.length === 0) return;
      let csv = "";
      rows.forEach(row => {
        const cols = row.querySelectorAll("th, td");
        const values = Array.from(cols).map(td => `"${td.innerText}"`);
        csv += values.join(",") + "\n";
      });
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "investicia_porovnanie.csv";
      link.click();
    }

    function exportPDF() {
      if (document.querySelectorAll("table tr").length === 0) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape'); 
      doc.text("Ročný prehľad - Zložené vs Jednoduché úrokovanie", 14, 15);
      doc.autoTable({ html: 'table', startY: 20, theme: 'grid' });
      doc.save("investicia_tabulka.pdf");
    }

    function exportChart() {
      if (!myChart) return;
      const origCanvas = document.getElementById('investmentChart');
      const bgCanvas = document.createElement('canvas');
      bgCanvas.width = origCanvas.width;
      bgCanvas.height = origCanvas.height;
      const ctx = bgCanvas.getContext('2d');
      ctx.fillStyle = document.getElementById('bgColorSelect').value;
      ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      ctx.drawImage(origCanvas, 0, 0);
      const link = document.createElement('a');
      link.href = bgCanvas.toDataURL('image/png');
      link.download = 'investicia_graf.png';
      link.click();
    }

    function exportChartAndTableToPDF() {
      if (!myChart || document.querySelectorAll("table tr").length === 0) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape');
      
      const origCanvas = document.getElementById('investmentChart');
      const bgCanvas = document.createElement('canvas');
      bgCanvas.width = origCanvas.width;
      bgCanvas.height = origCanvas.height;
      const ctx = bgCanvas.getContext('2d');
      ctx.fillStyle = document.getElementById('bgColorSelect').value;
      ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      ctx.drawImage(origCanvas, 0, 0);
      
      doc.text("Graf vývoja investície", 14, 15);
      doc.addImage(bgCanvas.toDataURL('image/png'), 'PNG', 15, 20, 260, 100);
      
      doc.text("Tabuľka hodnôt", 14, 130);
      doc.autoTable({ html: 'table', startY: 135, theme: 'grid', styles: { fontSize: 8 } });
      
      doc.save("investicia_komplet.pdf");
    }
  </script>
</body>
</html>
